name: STAG CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run All Unit & Integration Tests
        run: ./mvnw -B test

      - name: Package Spring Boot Executable Archive
        run: ./mvnw -B package -DskipTests

      - name: Verify Docker Container Build
        run: docker build -t stag-game-server:test .
